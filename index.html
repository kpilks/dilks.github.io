<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccooper</title>
<meta name="description" content="ccooper.co.uk">
<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff5a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f1ec;
    --fg: #121211;
    --muted: #8a877f;
    --line: #d9d5cc;
    --accent: #ff5a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e0d;
      --fg: #edeae3;
      --muted: #77746d;
      --line: #2a2926;
      --accent: #ff6a33;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    letter-spacing: .02em;
    display: grid;
    grid-template-rows: auto 1fr auto;
    min-height: 100svh;
    padding: clamp(16px, 4vw, 40px);
    -webkit-font-smoothing: antialiased;
  }
  header, footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--muted);
    gap: 16px;
  }
  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 8px;
    vertical-align: 1px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .25; } }
  main {
    align-self: center;
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 5vw, 48px);
  }
  h1 {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400;
    font-size: clamp(72px, 34vw, 360px);
    line-height: .85;
    letter-spacing: -.035em;
    padding-bottom: .12em;
  }
  h1 em { font-style: italic; color: var(--accent); }
  nav ul { list-style: none; padding: 0; border-top: 1px solid var(--line); max-width: 560px; }
  nav li { border-bottom: 1px solid var(--line); }
  nav a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
    padding: 16px 0;
    color: var(--fg);
    text-decoration: none;
    transition: padding .25s ease, color .25s ease;
  }
  nav a span:last-child { color: var(--muted); transition: transform .25s ease, color .25s ease; }
  nav a:hover, nav a:focus-visible { padding-left: 10px; color: var(--accent); outline: none; }
  nav a:hover span:last-child, nav a:focus-visible span:last-child { transform: translateX(4px); color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    nav a, nav a span:last-child { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <span><span class="dot" aria-hidden="true"></span>ccooper.co.uk</span>
    <span id="clock" aria-label="Time in London">London</span>
  </header>

  <main>
    <h1>c<em>c</em>ooper</h1>
    <nav aria-label="Projects">
      <ul>
        <li><a href="/predictor/"><span>Prediction League</span><span>→</span></a></li>
      </ul>
    </nav>
  </main>

<script>
  (function () {
    var el = document.getElementById('clock');
    var fmt;
    try {
      fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    } catch (e) { return; }
    function tick() { el.textContent = 'London ' + fmt.format(new Date()); }
    tick();
    setInterval(tick, 1000);
    document.getElementById('year').textContent = new Date().getFullYear();
  })();
</script>
</body>
</html>
